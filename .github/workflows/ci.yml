name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════
  # CI: build + typecheck en cada PR/push
  # ═══════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Subir dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ═══════════════════════════════════════════════
  # CD: deploy a Lightsail (eu-west-2) al pushear a main
  # ═══════════════════════════════════════════════
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Descargar dist compilado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Verificar conexión SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'echo OK && node --version && pm2 --version'

      - name: Preparar directorio en servidor
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'sudo mkdir -p /opt/whatsapp-core && sudo chown -R ${{ secrets.LIGHTSAIL_USER }}:${{ secrets.LIGHTSAIL_USER }} /opt/whatsapp-core'

      - name: Sincronizar código (sin dist — va como artefacto)
        run: |
          rsync -avz --delete --exclude node_modules --exclude .git --exclude sessions --exclude dist --exclude '*.log' \
            -e 'ssh -o StrictHostKeyChecking=no' \
            ./ ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/whatsapp-core/

      - name: Subir dist compilado
        run: |
          rsync -avz --delete -e 'ssh -o StrictHostKeyChecking=no' \
            ./dist/ ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/whatsapp-core/dist/

      - name: Instalar dependencias de producción
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'cd /opt/whatsapp-core && npm ci --omit=dev'

      - name: Reiniciar servicio con PM2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'cd /opt/whatsapp-core && \
             pm2 describe whatsapp-core > /dev/null 2>&1 && pm2 restart whatsapp-core --update-env || \
             (pm2 start dist/server.js --name whatsapp-core && pm2 save)'

      - name: Verificar deploy
        run: |
          sleep 5
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:8000/health || echo "⚠️ Health check pendiente (revisar PM2)"
